services:
  localstack:
    image: localstack/localstack:4
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb
      DEBUG: "0"
      # LocalStack accepts any credentials, but the SDK requires them to exist.
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      # Quote the whole command: an unquoted '*' starts a YAML alias.
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -Eq '\"dynamodb\": ?\"(available|running)\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Leaner alternative: docker compose --profile ddblocal up -d --wait
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    profiles: ["ddblocal"]
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
